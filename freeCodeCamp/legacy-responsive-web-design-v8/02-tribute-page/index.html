<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tribute Page</title>
    <link rel="stylesheet" href="styles.css" />
    
  </head>
  <body>
    <div class="main-background">
    <main id="main">
      <div class="title-card">
        <h1 id="title">The Nostr Protocol</h1>
        <h3 id="subtitle">Notes and other stuff transmitted by relays</h3>
      </div>
      <figure class="img-div" id="img-div">
        <img id="image" src="https://github.com/mbarulli/nostr-logo/raw/main/PNG/nostr-logo-white-on-purple-929x363.png" alt="The Nostr logo" />
        <figcaption id="img-caption">The Nostr logo with its popular ostriche mascot</figcaption>
      </figure>
      <div class="tribute-info" id="tribute-info">
        <h2 class="title2">What is Nostr?</h2>
        <p>Nostr is a protocol, designed for simplicity, that aims to create a censorship-resistant global social network.</p>

      </div>
      <div class="more-info">
        <p>Learn more about Nostr and how to get started at <a id="tribute-link" href="nostr.com" target="_blank">nostr.com</a></p>

      </div>
    </main>
    </div>
  </body>
  <footer></footer>
</html>
