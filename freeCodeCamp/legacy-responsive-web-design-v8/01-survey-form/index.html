<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Athlete Survey</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1 id="title">Athlete Survey</h1>
    <p id="description">What is your reason for doing sports?</p>

    <form id="survey-form">
      <fieldset>
        <!-- NAME -->
        <label id="name-label" for="name">Enter your name: <input id="name" name="name" type="text" placeholder="John Smith" required /></label>
      </fieldset>
      <fieldset>
        <!-- EMAIL -->
        <label id="email-label" for="email">Enter your email: <input id="email" name="email" type="email" placeholder="johnsmith1@athlete.com" required /></label>
      </fieldset>
      <fieldset>
        <!-- NUMBER -->
        <label id="number-label" for="number">Enter the number of years in sports: <input id="number" name="number" type="number" placeholder="5" required min="0" max="100" /></label>
      </fieldset>
      <fieldset>
        <!-- SELECT DROPDOWN -->
        <label for="dropdown">How would you describe your skill level?<select id="dropdown" name="dropdown">
          <option value="">Select one</option>
          <option value="1">Novice</option>
          <option value="2">Intermediate</option>
          <option value="2">Expert</option>
          <option value="3">Professional</option>
          </select></label>
      </fieldset>
      <fieldset>
        <!-- RADIO -->
        <legend>Are you interested in professional coaching?</legend>
        <label for="yes"><input class="inline" id="yes" type="radio" name="interest-coaching" value="yes" checked /> Yes</label>
        <label for="no"><input class="inline" id="no" type="radio" name="interest-coaching" value="no" /> No</label>
      </fieldset>
      <fieldset>
        <!-- CHECKBOXES -->
        <legend>Which sport are you interested in? (select all that apply)</legend>
        <label for="football"><input class="inline" id="football" type="checkbox" value="football" /> Football </label>
        <label for="soccer"><input class="inline" id="soccer" type="checkbox" value="soccer" /> Soccer</label>
        <label for="kickboxing"><input class="inline" id="kickboxing" type="checkbox" value="kickboxing" /> Kickboxing</label>
      </fieldset>
      <fieldset>
        <!-- TEXT AREA -->
        <label for="bio"> Enter a short bio: 
          <textarea id="bio" name="bio" cols="30" rows="4" placeholder="I started playing soccer when..."></textarea>
        </label>
      </fieldset>
      <fieldset>
        <!-- SUBMIT BUTTON -->
        <input id="submit" type="submit" value="submit">
      </fieldset>
    </form>
  </body>

</html>
